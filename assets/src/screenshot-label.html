<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{font-family:Inter,sans-serif;background:radial-gradient(900px 600px at 20% 0,#cfe9e9,transparent 70%),#eef4f4;display:flex;align-items:center;justify-content:center;gap:90px;color:#161D1D}
.phone{width:380px;height:780px;background:#fbfdfd;border-radius:44px;border:10px solid #1b2425;box-shadow:0 40px 80px rgba(14,20,21,.28);overflow:hidden;position:relative}
.bar{padding:26px 22px 8px;font-size:22px;font-weight:700}.sub{padding:0 22px 14px;color:#5b6b6b;font-size:13px}
.grid{margin:6px 22px;height:250px;background:#fff;border:1px solid #d8e3e3;position:relative;background-image:linear-gradient(#e6eeee 1px,transparent 1px),linear-gradient(90deg,#e6eeee 1px,transparent 1px);background-size:20px 20px}
.el{position:absolute;font-size:15px;font-weight:700}.sel{outline:2px solid #00696B;padding:2px 4px}
.bc{position:absolute;left:20px;bottom:24px;width:200px;height:56px;background:repeating-linear-gradient(90deg,#161D1D 0 3px,#fff 3px 5px,#161D1D 5px 6px,#fff 6px 9px)}
.row{margin:12px 22px;display:flex;gap:8px;font-size:13px}.row span{background:#d9f0f0;color:#00494b;border-radius:8px;padding:4px 10px}
.t{margin:14px 22px;font-size:13px;color:#5b6b6b}.t b{color:#161D1D}
.fab{position:absolute;right:20px;bottom:24px;background:#00696B;color:#fff;border-radius:18px;padding:16px 22px;font-weight:700;font-size:15px}
.lab{width:360px;height:240px;background:#fff;border-radius:6px;box-shadow:0 30px 60px rgba(14,20,21,.22);position:relative;font-family:Inter}
h2{font-size:15px;color:#5b6b6b;font-weight:500;margin:0 0 12px;text-align:center}
</style></head><body>
<div class="phone"><div class="bar">Label designer</div><div class="sub">50 × 30 mm · gap · TSPL</div>
<div class="grid"><div class="el sel" style="left:20px;top:18px">{{product}}</div><div class="el" style="left:20px;top:52px;font-weight:500;font-size:13px">Lot {{lot}}</div><div class="el" style="right:20px;top:18px">{{price|money}}</div><div class="bc"></div></div>
<div class="row"><span>Text</span><span>Barcode</span><span>QR</span><span>Image</span></div>
<div class="t"><b>Data:</b> harvest-oct.csv · 48 rows<br><b>Copies:</b> 1 per row · serial from 1001</div>
<div class="fab">Print 48</div></div>
<div><h2>Preview · row 12</h2><div class="lab"><div style="position:absolute;left:28px;top:24px;font-weight:700;font-size:26px">Hazel Honey 340g</div><div style="position:absolute;left:28px;top:66px;font-size:17px;color:#444">Lot B-2291 · Best before 03/2028</div><div style="position:absolute;right:28px;top:24px"></div><div style="position:absolute;left:28px;bottom:30px;width:300px;height:70px;background:repeating-linear-gradient(90deg,#161D1D 0 3px,#fff 3px 5px,#161D1D 5px 6px,#fff 6px 9px)"></div><div style="position:absolute;left:28px;bottom:10px;font-family:'JetBrains Mono';font-size:12px">5 060217 340112</div></div></div>
</body></html>
